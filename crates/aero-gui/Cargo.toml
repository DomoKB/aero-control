[package]
name = "aero-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "egui status view and fan-curve editor for aero-control"

[dependencies]
aero-core = { path = "../aero-core" }
aero-wmi = { path = "../aero-wmi" }
aero-kbd = { path = "../aero-kbd" }
eframe = "0.29"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"
