[package]
name = "aero-wmi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "GB_WMIACPI get/set transport for aero-control, with a hardware-free mock"

[features]
# The writer talks to GB_WMIACPI_Set. aero-probe leaves this off so the
# probe binary does not contain a setter implementation.
default = ["writer"]
writer = []

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# 0.14 is the release that typechecks here. Calls do not use its
# exec_method_native_wrapper: that helper spawns an empty in-params object
# and can target the class path, which this laptop rejects with 0x8004102F.
wmi = "0.14"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
serde_json = "1"
