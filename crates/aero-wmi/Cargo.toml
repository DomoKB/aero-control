[package]
name = "aero-wmi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "GB_WMIACPI get/set transport for aero-control, with a hardware-free mock"

[features]
# The writer talks to GB_WMIACPI_Set. aero-probe leaves this off so the
# probe binary does not contain a setter implementation.
default = ["writer"]
writer = []

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
